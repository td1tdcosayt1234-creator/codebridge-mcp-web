# CodeBridge — 6h Actions hosting (same pattern as elsemail-fs fs-host.yml)
#
# Keeps https://roun.sryze.cc (+ dash/api) online from a GitHub runner (~6h max per job).
# Tunnel ingress + DNS already point to localhost:3001, so the runner just has to
# boot Next.js on :3001 and connect cloudflared with the tunnel token.
#
# Triggers:
#   - workflow_dispatch (manual / keeper / self-chain)
#   - schedule every 6h (fallback if self-chain secret missing)
#
# Required repo secret (Settings -> Secrets and variables -> Actions):
#   TUNNEL_TOKEN_ROUN - tunnel token for roun-codebridge (JWT eyJh...).
#     Get it: Cloudflare dashboard -> Zero Trust -> Networks -> Tunnels ->
#     roun-codebridge -> Configure -> token, OR API:
#     GET /accounts/<ACCT>/cfd_tunnel/<TUNNEL>/token (cfat_... token)
#
# Optional secrets (safe defaults generated at runtime if missing):
#   AUTH_SECRET, TOKEN_ENC_KEY (32B hex generated if empty)
#   ADMIN_EMAIL (default admin@local.test), ADMIN_PASSWORD (auto-generated, shown in build log)
#   GOOGLE_SITE_VERIFICATION (Search Console meta, empty = skip)
#   DB_MASTER_KEY (empty = plaintext DB like local dev)
#   FIREBASE_DATABASE_URL + FIREBASE_SERVICE_ACCOUNT (shared DB — without them
#     each runner uses its own empty local file; see .env.example)
#   GH_PAT - classic PAT (repo + workflow) for zero-downtime self-chain.
#     Without it the job still runs 6h; restart relies on schedule (may gap).
#
# Keeper alternative (like elsemail-keeper): cron every 5m checks
# https://roun.sryze.cc/api/health and dispatches this workflow when offline.

name: CodeBridge host (6h)

on:
  workflow_dispatch:
  schedule:
    - cron: "25 */6 * * *" # fallback tic every 6h

jobs:
  host-web:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6h = Actions max per job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Write .env (defaults + secrets)
        run: |
          AUTH=${AUTH_SECRET:-$(openssl rand -hex 32)}
          ENC=${TOKEN_ENC_KEY:-$(openssl rand -hex 32)}
          {
            echo "AUTH_SECRET=$AUTH"
            echo "TOKEN_ENC_KEY=$ENC"
            echo "SITE_URL=https://roun.sryze.cc"
            echo "NEXT_PUBLIC_SITE_URL=https://roun.sryze.cc"
            echo "ADMIN_EMAIL=${ADMIN_EMAIL:-admin@local.test}"
            [ -n "${ADMIN_PASSWORD:-}" ] && echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            [ -n "${DB_MASTER_KEY:-}" ] && echo "DB_MASTER_KEY=$DB_MASTER_KEY"
            [ -n "${GOOGLE_SITE_VERIFICATION:-}" ] && echo "GOOGLE_SITE_VERIFICATION=$GOOGLE_SITE_VERIFICATION"
            [ -n "${FIREBASE_DATABASE_URL:-}" ] && echo "FIREBASE_DATABASE_URL=$FIREBASE_DATABASE_URL"
            [ -n "${FIREBASE_DB_PATH:-}" ] && echo "FIREBASE_DB_PATH=$FIREBASE_DB_PATH"
          } > .env
          # service-account JSON may contain newlines — write via node to keep it intact
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            node -e "const fs=require('fs');let e=fs.readFileSync('.env','utf8');e+='FIREBASE_SERVICE_ACCOUNT='+process.env.FIREBASE_SERVICE_ACCOUNT.replace(/\n/g,'\\n')+'\n';fs.writeFileSync('.env',e)"
            echo "firebase service account configured"
          else
            echo "no firebase config — local file mode"
          fi
          echo ".env written (auth secret ${#AUTH} chars)"
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DB_MASTER_KEY: ${{ secrets.DB_MASTER_KEY }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_DB_PATH: ${{ secrets.FIREBASE_DB_PATH }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Build
        run: npm run build

      - name: Start prod server :3001
        run: |
          nohup npm run start -- -p 3001 -H 0.0.0.0 > prod-server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health; then echo; break; fi
            echo "waiting server... $i"; sleep 5
          done
          curl -fsS http://localhost:3001/api/health

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared --version

      - name: Start Cloudflare Tunnel (roun-codebridge)
        run: |
          if [ -z "${TUNNEL_TOKEN_ROUN}" ]; then echo "TUNNEL_TOKEN_ROUN secret missing!"; exit 1; fi
          nohup ./cloudflared tunnel --no-autoupdate --protocol http2 run --token "${TUNNEL_TOKEN_ROUN}" > tunnel.log 2>&1 &
          echo $! > tunnel.pid
          sleep 20
          grep -E "Registered tunnel connection|ERR|error" tunnel.log | tail -8 || true
        env:
          TUNNEL_TOKEN_ROUN: ${{ secrets.TUNNEL_TOKEN_ROUN }}

      - name: Verify public URL
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://roun.sryze.cc/api/health; then echo; break; fi
            echo "retry $i..."; sleep 10
          done
          curl -fsS -o /dev/null -w "roun=%{http_code}\n" https://roun.sryze.cc/
          curl -fsS -o /dev/null -w "dash=%{http_code}\n" https://dash.roun.sryze.cc/
          curl -fsS -o /dev/null -w "mcp=%{http_code}\n" https://api.roun.sryze.cc/api/mcp

      - name: Keep alive 5h30m
        run: |
          echo "CodeBridge live via Actions runner until ~6h mark"
          sleep 19800 # 5h30m (build+tunnel took ~10-20m, total ~6h)
        timeout-minutes: 335

      - name: Self-chain replacement (zero downtime)
        if: always()
        continue-on-error: true
        run: |
          if [ -z "${GH_PAT}" ]; then echo "GH_PAT not set - relying on schedule (may gap)"; exit 0; fi
          WF_ID=$(curl -fsSL -H "Authorization: Bearer ${GH_PAT}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/codebridge-host.yml" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).id))")
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_PAT}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WF_ID}/dispatches" \
            -d '{"ref":"main"}' && echo "replacement dispatched"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Hold until 6h mark then exit
        if: always()
        run: |
          sleep 1500 # ~25m overlap while replacement boots
          echo "--- tail logs ---"; tail -20 prod-server.log; tail -10 tunnel.log
        timeout-minutes: 30
