name: Check admin email (one-time)

on:
  workflow_dispatch:

jobs:
  check-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: List admin emails from Firebase (no secrets, no hashes)
        run: |
          node -e '
          (async () => {
            const crypto = require("crypto");
            function decWith(secret, enc) {
              try {
                const k = crypto.createHash("sha256").update(secret).digest();
                const b = Buffer.from(enc, "base64");
                const iv = b.subarray(0, 12);
                const tag = b.subarray(12, 28);
                const ct = b.subarray(28);
                const d = crypto.createDecipheriv("aes-256-gcm", k, iv);
                d.setAuthTag(tag);
                return Buffer.concat([d.update(ct), d.final()]).toString("utf8");
              } catch (e) { return ""; }
            }
            const url = (process.env.FIREBASE_DATABASE_URL || "").trim();
            const svc = (process.env.FIREBASE_SERVICE_ACCOUNT || "").trim();
            const dbPath = (process.env.FIREBASE_DB_PATH || "codebridge/maindb").trim().replace(/^\/+|\/+$/g, "") || "codebridge/maindb";
            const masterKey = (process.env.DB_MASTER_KEY || "").trim();
            console.log("dbPath=" + dbPath);
            console.log("url_set=" + (url ? "yes len=" + url.length : "no"));
            console.log("svc_set=" + (svc ? "yes len=" + svc.length : "no"));
            if (!url) { console.log("RESULT: firebase disabled (no URL)"); return; }
            if (!svc && !(process.env.FIREBASE_PROJECT_ID && process.env.FIREBASE_CLIENT_EMAIL && process.env.FIREBASE_PRIVATE_KEY)) {
              console.log("RESULT: firebase disabled (no service account)"); return;
            }
            const admin = require("firebase-admin");
            let cred;
            if (svc) {
              let parsed = null;
              try { parsed = JSON.parse(svc); }
              catch (e) {
                try { parsed = JSON.parse(svc.replace(/\n/g, "\\n")); }
                catch (e2) { console.log("RESULT: service account JSON parse failed"); return; }
              }
              cred = admin.cert(parsed);
            } else {
              cred = admin.cert({
                projectId: (process.env.FIREBASE_PROJECT_ID || "").trim(),
                clientEmail: (process.env.FIREBASE_CLIENT_EMAIL || "").trim(),
                privateKey: (process.env.FIREBASE_PRIVATE_KEY || "").replace(/\\n/g, "\n").trim(),
              });
            }
            admin.initializeApp({ credential: cred, databaseURL: url });
            const { getDatabase } = require("firebase-admin/database");
            const ref = getDatabase().ref(dbPath);
            const snap = await ref.get();
            if (!snap.exists()) { console.log("RESULT: empty node, no data yet"); return; }
            const v = snap.val();
            let payload = null;
            if (typeof v === "string") payload = v;
            else if (v && typeof v === "object" && typeof v.payload === "string") payload = v.payload;
            else payload = JSON.stringify(v);
            console.log("payload_len=" + payload.length);
            let plain = payload;
            const t = payload.trim();
            if (t.startsWith("{\"v\":1") || t.startsWith("{\"v\": 1")) {
              if (masterKey.length < 16) { console.log("RESULT: db encrypted but DB_MASTER_KEY missing/short"); return; }
              let data = "";
              try { data = (JSON.parse(t)).data || ""; } catch (e) { console.log("RESULT: envelope corrupt"); return; }
              plain = decWith(masterKey, data);
              if (!plain) { console.log("RESULT: decrypt failed (wrong DB_MASTER_KEY?)"); return; }
              console.log("decrypted_ok=yes");
            } else {
              console.log("encrypted=no (plaintext json)");
            }
            const doc = JSON.parse(plain);
            const users = doc.users || [];
            console.log("RESULT: total_users=" + users.length);
            for (const u of users.slice(0, 20)) {
              console.log("USER role=" + u.role + " email=" + u.email + " id=" + u.id + " plan=" + u.plan);
            }
            const admins = users.filter((u) => u.role === "admin");
            console.log("RESULT: admin_count=" + admins.length);
            for (const a of admins) console.log("ADMIN email=" + a.email + " id=" + a.id);
          })().catch((e) => { console.log("RESULT: error " + (e && e.message || e)); process.exit(0); });
          '
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_PATH: ${{ secrets.FIREBASE_DB_PATH }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          DB_MASTER_KEY: ${{ secrets.DB_MASTER_KEY }}
