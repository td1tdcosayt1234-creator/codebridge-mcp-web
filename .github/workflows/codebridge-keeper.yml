# CodeBridge keeper — checks site health every 5 minutes and re-boots the
# 6h host workflow when https://roun.sryze.cc is unreachable.
name: CodeBridge keeper (health)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        id: hc
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://roun.sryze.cc/api/health || echo 000)
          echo "code=$code"
          if [ "$code" = "200" ]; then echo "healthy=true" >> "$GITHUB_OUTPUT"; else echo "healthy=false" >> "$GITHUB_OUTPUT"; fi
      - name: Dispatch host workflow when down
        if: steps.hc.outputs.healthy != 'true'
        run: gh workflow run codebridge-host.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
